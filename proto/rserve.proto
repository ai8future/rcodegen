syntax = "proto3";
package rserve;
option go_package = "rcodegen/pkg/server/pb";

service RServe {
  // Run a single tool task (rclaude, rcodex, rgemini), stream events back
  rpc RunTask(RunTaskRequest) returns (stream RunEvent);

  // Run a bundle (orchestrated multi-step workflow), stream events back
  rpc RunBundle(RunBundleRequest) returns (stream RunEvent);

  // List available task shortcuts and bundles
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);

  // Get server status (health, active runs)
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);

  // Cancel a running task by run ID
  rpc CancelRun(CancelRunRequest) returns (CancelRunResponse);
}

message RunTaskRequest {
  string tool = 1;           // "claude", "codex", "gemini"
  string task = 2;           // Task text or shortcut name
  string model = 3;          // Model override (optional)
  string max_budget = 4;     // Budget in USD (optional)
  repeated string work_dirs = 5; // Target directories
  map<string, string> variables = 6; // Template variables (-x key=val)
}

message RunBundleRequest {
  string bundle = 1;         // Bundle name
  map<string, string> inputs = 2;  // Bundle inputs
  bool opus_only = 3;
  bool flash_only = 4;
}

message RunEvent {
  string run_id = 1;
  int64 timestamp_ms = 2;
  oneof event {
    InitEvent init = 3;
    TextEvent text = 4;
    ToolUseEvent tool_use = 5;
    StepProgressEvent step_progress = 6;
    ResultEvent result = 7;
    ErrorEvent error = 8;
  }
}

message InitEvent {
  string session_id = 1;
  string tool = 2;
  string model = 3;
}

message TextEvent {
  string content = 1;
}

message ToolUseEvent {
  string tool_name = 1;      // "Read", "Write", "Bash", etc.
  string summary = 2;        // Formatted summary (file path, command, etc.)
}

message StepProgressEvent {
  string step_name = 1;
  string status = 2;         // "running", "completed", "skipped", "failed"
  string tool = 3;
  string model = 4;
  double cost_usd = 5;
  int64 duration_ms = 6;
  int32 tokens = 7;
}

message ResultEvent {
  int32 exit_code = 1;
  string output = 2;         // Final result text
  TokenUsage usage = 3;
  double total_cost_usd = 4;
  string grade = 5;          // Extracted grade if present
}

message ErrorEvent {
  string message = 1;
  int32 code = 2;
}

message TokenUsage {
  int32 input_tokens = 1;
  int32 output_tokens = 2;
  int32 cache_read_tokens = 3;
  int32 cache_creation_tokens = 4;
}

message ListTasksRequest {}
message ListTasksResponse {
  repeated TaskInfo tasks = 1;
  repeated BundleInfo bundles = 2;
}
message TaskInfo {
  string name = 1;
  string description = 2;
  string tool = 3;
}
message BundleInfo {
  string name = 1;
  string description = 2;
  int32 step_count = 3;
}

message GetStatusRequest {}
message GetStatusResponse {
  string version = 1;
  int32 active_runs = 2;
  int32 max_concurrent = 3;
  repeated ActiveRun runs = 4;
}
message ActiveRun {
  string run_id = 1;
  string tool = 2;
  string task = 3;
  int64 started_at_ms = 4;
}

message CancelRunRequest { string run_id = 1; }
message CancelRunResponse { bool cancelled = 1; string message = 2; }
